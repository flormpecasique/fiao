<title>Fiao</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cuaderno de fiado para bodegas y emprendedores: deudas en $ y Bs, tasa del día y cobro por WhatsApp. Funciona sin internet.">
<meta name="theme-color" content="#1d2a57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Libreta de bodega: hoja cuadriculada, tinta azul, margen rojo, resaltador amarillo. Una columna móvil. */
:root{
  --paper:#f7f9ff; --surface:#ffffff; --ink:#1d2a57; --muted:#5b668c; --line:#dde3f3;
  --rule:rgba(45,85,180,.075); --margin:#d6455c; --ok:#17855a; --hi:#ffe46b; --hi-ink:#1d2a57;
  --ink-soft:rgba(29,42,87,.06); --shadow:0 1px 2px rgba(29,42,87,.06),0 6px 20px rgba(29,42,87,.07);
  --f-hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1631; --surface:#162144; --ink:#e8ecff; --muted:#9ba7d0; --line:#27335c;
  --rule:rgba(150,180,255,.055); --margin:#ff6f84; --ok:#4cd597; --hi:#f2c94c; --hi-ink:#14193a;
  --ink-soft:rgba(232,236,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1631; --surface:#162144; --ink:#e8ecff; --muted:#9ba7d0; --line:#27335c;
  --rule:rgba(150,180,255,.055); --margin:#ff6f84; --ok:#4cd597; --hi:#f2c94c; --hi-ink:#14193a;
  --ink-soft:rgba(232,236,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{margin:0}
[hidden]{display:none!important}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--margin);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-hand);font-weight:700;font-size:30px;line-height:1;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;min-width:0}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.rate{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;box-shadow:var(--shadow)}
.rate label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rate input{width:84px;border:0;background:transparent;font-family:var(--f-num);font-weight:600;font-size:15px;text-align:right;padding:2px 0}
.rate input:focus{outline:none}
.rate:focus-within{border-color:var(--ink)}
.rate .unit{font-size:12px;color:var(--muted);padding-right:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink)}

/* Resumen */
.sum{margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end;padding-left:18px;position:relative}
.sum::before{content:"";position:absolute;left:4px;top:2px;bottom:2px;width:2px;background:var(--margin);opacity:.75;border-radius:2px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.total{font-family:var(--f-num);font-weight:600;font-size:clamp(34px,10vw,46px);line-height:1.05;letter-spacing:-.03em}
.total mark{background:linear-gradient(transparent 52%,var(--hi) 52%,var(--hi) 92%,transparent 92%);color:inherit;padding:0 4px;margin:0 -4px}
.total-bs{font-family:var(--f-num);color:var(--muted);font-size:14px}
.stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--ink-soft);border:1px solid transparent}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.late{color:var(--margin);background:color-mix(in srgb,var(--margin) 10%,transparent)}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.chip.example{color:var(--muted);font-weight:500}

/* Búsqueda */
.tools{display:flex;gap:8px;margin-top:20px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search svg{width:18px;height:18px;stroke:var(--muted);flex:none}
.search input{border:0;background:transparent;flex:1;min-width:0;height:100%;font-size:15px}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--ink)}
select.sort{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;padding:0 10px;font-size:14px;max-width:150px}

/* Lista de clientes: renglones de libreta */
.list{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 14px;min-height:68px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--ink-soft)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:20px;background:var(--ink-soft);color:var(--ink)}
.who{min-width:0}
.who b{font-family:var(--f-hand);font-weight:700;font-size:20px;line-height:1.15;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 5px}
.tag.late{color:var(--margin);background:color-mix(in srgb,var(--margin) 12%,transparent)}
.tag.ex{color:var(--muted);background:var(--ink-soft)}
.owe{text-align:right}
.owe .usd{font-family:var(--f-num);font-weight:600;font-size:16px;color:var(--margin)}
.owe .usd.zero{color:var(--ok)}
.owe .bs{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-hand);font-size:24px;color:var(--ink);margin-bottom:4px}

.banner{margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.linkbtn{background:none;border:0;padding:4px 0;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* Botón flotante */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 20px;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(20,30,70,.28)}
.fab svg{width:20px;height:20px;stroke:currentColor}

/* Detalle */
.back{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600}
.back svg{width:18px;height:18px;stroke:currentColor}
.client-head{margin-top:6px;display:flex;gap:14px;align-items:flex-start}
.client-head h1{font-family:var(--f-hand);font-weight:700;font-size:36px;line-height:1.05;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.client-head .meta{font-size:13px;color:var(--muted);margin-top:4px}
.client-head .edit{margin-left:auto}
.balance{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--margin)}
.balance.paid::after{background:var(--ok)}
.balance .total{font-size:clamp(32px,9vw,40px)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border-radius:12px;height:48px;padding:0 14px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.btn svg{width:18px;height:18px;stroke:currentColor}
.btn.debt{background:var(--margin);border-color:var(--margin);color:#fff}
.btn.pay{background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme="dark"] .btn.pay,:root[data-theme="dark"] .btn.debt{color:#0e1631}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pay,:root:not([data-theme="light"]) .btn.debt{color:#0e1631}}
.btn.wa{grid-column:1/-1;background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.ghost{background:transparent}
.btn.full{width:100%}

.history{margin-top:22px}
.history h2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.mov{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:0}
.mov .sign{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700}
.mov.fiado .sign{color:var(--margin);background:color-mix(in srgb,var(--margin) 12%,transparent)}
.mov.abono .sign{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.mov .what{min-width:0}
.mov .what b{display:block;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.mov .what span{font-size:12px;color:var(--muted)}
.mov .amt{text-align:right;font-family:var(--f-num)}
.mov .amt .u{font-weight:600}
.mov.fiado .amt .u{color:var(--margin)}
.mov.abono .amt .u{color:var(--ok)}
.mov .amt .o{display:block;font-size:11.5px;color:var(--muted)}
.mov .del{background:none;border:0;color:var(--muted);font-size:12px;padding:2px 0;text-decoration:underline;text-underline-offset:2px}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,15,35,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);max-height:92vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font-family:var(--f-hand);font-weight:700;font-size:26px;margin:0 0 12px;line-height:1.1}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font-size:16px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.amount-row{display:flex;gap:8px}
.amount-row input{flex:1;min-width:0;font-family:var(--f-num);font-size:22px;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:0 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hint{font-size:13px;color:var(--muted);font-family:var(--f-num);min-height:20px}
.sheet .row2{display:flex;gap:10px;margin-top:6px}
.sheet .row2 .btn{flex:1}
.err{color:var(--margin);font-size:13px;min-height:18px}
.msgbox{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14.5px;margin-bottom:10px;user-select:text}
.small{font-size:12.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:380px){.brand small{display:none}.rate input{width:70px}}
</style>

<div class="app" id="app"></div>
<div id="layer"></div>

<script>
(function(){
"use strict";
const KEY="fiao.v1";
const DAY=86400000, LATE_DAYS=15;

/* ---------- datos ---------- */
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function seed(){
  const now=Date.now(), t=36.5;
  const c=[
    {id:"e1",nombre:"Señora Carmen",tel:"04141234567",nota:"Casa azul, esquina",ejemplo:true,creado:now-40*DAY},
    {id:"e2",nombre:"José el mototaxista",tel:"04249876543",nota:"",ejemplo:true,creado:now-20*DAY},
    {id:"e3",nombre:"Yuleisy",tel:"04125551122",nota:"Paga los viernes",ejemplo:true,creado:now-9*DAY},
    {id:"e4",nombre:"Don Ramón",tel:"",nota:"",ejemplo:true,creado:now-30*DAY}
  ];
  const m=(cid,tipo,usd,daysAgo,nota,moneda)=>({id:uid(),cid,tipo,usd,moneda:moneda||"USD",orig:moneda==="VES"?Math.round(usd*t*100)/100:usd,tasa:t,nota,fecha:now-daysAgo*DAY,ejemplo:true});
  return {negocio:"Bodega La Esquina",tasa:t,tasaFecha:now,clientes:c,movs:[
    m("e1","fiado",8.5,32,"Harina, arroz y aceite"),
    m("e1","fiado",4,25,"Café y azúcar"),
    m("e1","abono",3,24,"Abono en efectivo"),
    m("e2","fiado",12,18,"Refrescos para la fiesta","VES"),
    m("e2","abono",5,6,"Pago móvil","VES"),
    m("e3","fiado",6.25,8,"Pañales"),
    m("e3","fiado",2.5,2,"Pan y queso"),
    m("e4","fiado",5,28,"Cigarros y fósforos"),
    m("e4","abono",5,10,"Pagó completo")
  ]};
}
let mem=null;
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){const d=JSON.parse(raw); if(d&&Array.isArray(d.clientes)) return d;}}catch(e){}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){mem=db}}
let db=load();

/* ---------- formato ---------- */
const fUSD=new Intl.NumberFormat("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
const fBS=new Intl.NumberFormat("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
const usd=n=>"$"+fUSD.format(Math.abs(n)<0.005?0:n);
const bs=n=>"Bs "+fBS.format(Math.abs(n)<0.005?0:n);
function parseNum(s){
  if(typeof s!=="string") return NaN;
  s=s.trim().replace(/\s/g,"");
  if(!s) return NaN;
  // acepta 1.234,56 · 1234,56 · 1234.56
  if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".")}
  else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,"")}
  const n=Number(s); return isFinite(n)?n:NaN;
}
function ago(ts){
  const d=Math.floor((Date.now()-ts)/DAY);
  if(d<=0) return "hoy"; if(d===1) return "ayer"; if(d<30) return "hace "+d+" días";
  const m=Math.floor(d/30); return m===1?"hace 1 mes":"hace "+m+" meses";
}
function fecha(ts){return new Date(ts).toLocaleDateString("es-VE",{day:"numeric",month:"short"})}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function initials(n){const p=n.trim().split(/\s+/).filter(w=>w.length>2||n.trim().split(/\s+/).length===1);return ((p[0]||n)[0]+(p[1]?p[1][0]:"")).toUpperCase()}

/* ---------- cálculo ---------- */
function stateOf(cid){
  const ms=db.movs.filter(m=>m.cid===cid).sort((a,b)=>a.fecha-b.fecha);
  let bal=0, lastPay=null, last=null, owingSince=null;
  for(const m of ms){
    const before=bal;
    bal+= m.tipo==="fiado"?m.usd:-m.usd;
    bal=Math.round(bal*100)/100;
    if(m.tipo==="abono") lastPay=m.fecha;
    last=m.fecha;
    if(before<=0.004&&bal>0.004) owingSince=m.fecha;
    if(bal<=0.004) owingSince=null;
  }
  // atrasado: debe y no ha abonado (o empezó a deber) hace más de 15 días
  const ref=Math.max(lastPay||0,owingSince||0);
  const late=bal>0.004&&ref>0&&(Date.now()-ref)>LATE_DAYS*DAY;
  return {bal,last,lastPay,late,movs:ms};
}
function summary(){
  let total=0,debtors=0,late=0;
  for(const c of db.clientes){const s=stateOf(c.id); if(s.bal>0.004){total+=s.bal;debtors++; if(s.late) late++;}}
  return {total:Math.round(total*100)/100,debtors,late};
}

/* ---------- vista ---------- */
const app=document.getElementById("app"), layer=document.getElementById("layer");
let view={name:"list",q:"",sort:"debe"};

const I={
  search:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  cog:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 20.5l1.6-5.5A8.4 8.4 0 1 1 21 11.5Z"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>'
};

function header(){
  return `<header class="top">
    <div class="brand">Fiao<small>${esc(db.negocio||"Mi negocio")}</small></div>
    <div class="rate" title="Tasa del día: bolívares por dólar">
      <label for="tasa">Tasa</label>
      <input id="tasa" inputmode="decimal" value="${fBS.format(db.tasa||0)}" aria-label="Tasa del día en bolívares por dólar">
      <span class="unit">Bs/$</span>
    </div>
    <button class="iconbtn" id="ajustes" aria-label="Ajustes">${I.cog}</button>
  </header>`;
}

function renderList(){
  const s=summary();
  const hasEx=db.clientes.some(c=>c.ejemplo);
  let rows=db.clientes.map(c=>({c,s:stateOf(c.id)}));
  const q=view.q.trim().toLowerCase();
  if(q) rows=rows.filter(r=>r.c.nombre.toLowerCase().includes(q)||(r.c.tel||"").includes(q));
  if(view.sort==="debe") rows.sort((a,b)=>(b.s.late-a.s.late)||(b.s.bal-a.s.bal));
  else if(view.sort==="nombre") rows.sort((a,b)=>a.c.nombre.localeCompare(b.c.nombre,"es"));
  else rows.sort((a,b)=>(b.s.last||0)-(a.s.last||0));

  app.innerHTML=header()+`
  <section class="sum" aria-label="Resumen">
    <div class="eyebrow">Te deben</div><div></div>
    <div class="total"><mark>${usd(s.total)}</mark></div>
    <div class="total-bs">${bs(s.total*db.tasa)}</div>
    <div class="stats">
      <span class="chip"><span class="dot"></span>${s.debtors} ${s.debtors===1?"cliente debe":"clientes deben"}</span>
      ${s.late?`<span class="chip late"><span class="dot"></span>${s.late} ${s.late===1?"atrasado":"atrasados"} +${LATE_DAYS} días</span>`:`<span class="chip ok"><span class="dot"></span>Nadie atrasado</span>`}
    </div>
  </section>
  ${hasEx?`<div class="banner"><span>Estás viendo clientes de ejemplo.</span><button class="linkbtn" id="clearEx">Borrar ejemplos y empezar</button></div>`:""}
  <div class="tools">
    <label class="search">${I.search}<input id="q" type="search" placeholder="Buscar cliente" value="${esc(view.q)}" aria-label="Buscar cliente"></label>
    <select class="sort" id="sort" aria-label="Ordenar">
      <option value="debe"${view.sort==="debe"?" selected":""}>Más deben</option>
      <option value="reciente"${view.sort==="reciente"?" selected":""}>Recientes</option>
      <option value="nombre"${view.sort==="nombre"?" selected":""}>A–Z</option>
    </select>
  </div>
  <div class="list" role="list">
    ${rows.length?rows.map(({c,s})=>`
      <button class="row" role="listitem" data-open="${c.id}">
        <span class="avatar" aria-hidden="true">${esc(initials(c.nombre))}</span>
        <span class="who"><b>${esc(c.nombre)}</b>
          <span>${s.last?ago(s.last):"sin movimientos"}${s.late?' <em class="tag late">Atrasado</em>':""}${c.ejemplo?' <em class="tag ex">Ejemplo</em>':""}</span></span>
        <span class="owe"><span class="usd${s.bal<=0.004?" zero":""}">${s.bal<=0.004?"Al día":usd(s.bal)}</span>
          ${s.bal>0.004?`<span class="bs" style="display:block">${bs(s.bal*db.tasa)}</span>`:""}</span>
      </button>`).join(""):`<div class="empty"><b>${q?"Nadie con ese nombre":"Tu libreta está vacía"}</b>${q?"Revisa cómo lo escribiste.":"Anota tu primer cliente con el botón de abajo."}</div>`}
  </div>
  <p class="foot">Tus datos se guardan en este teléfono y funcionan sin internet. Haz un respaldo en Ajustes.</p>
  <button class="fab" id="newClient">${I.plus}Nuevo cliente</button>`;
  bindHeader();
  const qi=document.getElementById("q");
  qi.addEventListener("input",e=>{view.q=e.target.value;const pos=qi.selectionStart;renderList();const n=document.getElementById("q");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}});
  document.getElementById("sort").addEventListener("change",e=>{view.sort=e.target.value;renderList()});
  app.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{view={...view,name:"client",id:b.dataset.open};render();window.scrollTo(0,0)}));
  document.getElementById("newClient").addEventListener("click",()=>clientSheet());
  const ce=document.getElementById("clearEx"); if(ce) ce.addEventListener("click",confirmClearExamples);
}

function renderClient(){
  const c=db.clientes.find(x=>x.id===view.id);
  if(!c){view.name="list";return renderList()}
  const s=stateOf(c.id);
  const paid=s.bal<=0.004;
  app.innerHTML=header()+`
  <button class="back" id="back">${I.back}Todos los clientes</button>
  <div class="client-head">
    <div style="min-width:0"><h1>${esc(c.nombre)}</h1>
      <div class="meta">${c.tel?esc(c.tel):"Sin teléfono"}${c.nota?" · "+esc(c.nota):""}</div></div>
    <button class="iconbtn edit" id="editC" aria-label="Editar cliente">${I.pen}</button>
  </div>
  <div class="balance${paid?" paid":""}">
    <div class="eyebrow">${paid?"Está al día":"Debe"}</div>
    <div class="total">${paid?usd(0):`<mark>${usd(s.bal)}</mark>`}</div>
    <div class="total-bs">${paid?(s.bal<-0.004?"Tiene a favor "+usd(-s.bal):"Sin deuda pendiente"):bs(s.bal*db.tasa)+" a tasa de hoy"}</div>
    ${s.late?`<div style="margin-top:8px"><span class="chip late"><span class="dot"></span>Sin abonar desde ${fecha(Math.max(s.lastPay||0,0)||s.movs.find(m=>m.tipo==="fiado").fecha)}</span></div>`:""}
  </div>
  <div class="actions">
    <button class="btn debt" id="addF">${I.plus}Fiar</button>
    <button class="btn pay" id="addA">Abonó</button>
    ${!paid?`<button class="btn wa" id="cobrar">${I.wa}Cobrar por WhatsApp</button>`:""}
  </div>
  <section class="history">
    <h2>Movimientos</h2>
    <div class="list">
      ${s.movs.length?s.movs.slice().reverse().map(m=>`
        <div class="mov ${m.tipo}">
          <span class="sign" aria-hidden="true">${m.tipo==="fiado"?"+":"−"}</span>
          <div class="what"><b>${esc(m.nota||(m.tipo==="fiado"?"Fiado":"Abono"))}</b>
            <span>${m.tipo==="fiado"?"Fiado":"Abono"} · ${fecha(m.fecha)} · <button class="del" data-del="${m.id}">borrar</button></span></div>
          <div class="amt"><span class="u">${usd(m.usd)}</span>${m.moneda==="VES"?`<span class="o">${bs(m.orig)} a ${fBS.format(m.tasa)}</span>`:""}</div>
        </div>`).join(""):`<div class="empty"><b>Sin movimientos</b>Anota lo que se lleva con “Fiar”.</div>`}
    </div>
  </section>`;
  bindHeader();
  document.getElementById("back").addEventListener("click",()=>{view.name="list";render()});
  document.getElementById("editC").addEventListener("click",()=>clientSheet(c));
  document.getElementById("addF").addEventListener("click",()=>movSheet(c,"fiado"));
  document.getElementById("addA").addEventListener("click",()=>movSheet(c,"abono",s.bal));
  const cb=document.getElementById("cobrar"); if(cb) cb.addEventListener("click",()=>waSheet(c,s));
  app.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>confirmSheet("¿Borrar este movimiento?","El saldo del cliente se recalcula.","Borrar",()=>{db.movs=db.movs.filter(m=>m.id!==b.dataset.del);save();render();toast("Movimiento borrado")})));
}

function bindHeader(){
  const t=document.getElementById("tasa");
  t.addEventListener("focus",()=>t.select());
  t.addEventListener("change",()=>{
    const n=parseNum(t.value);
    if(!(n>0)){t.value=fBS.format(db.tasa);toast("Escribe la tasa como 36,50");return}
    db.tasa=n;db.tasaFecha=Date.now();save();render();toast("Tasa actualizada: "+fBS.format(n)+" Bs/$");
  });
  t.addEventListener("keydown",e=>{if(e.key==="Enter")t.blur()});
  document.getElementById("ajustes").addEventListener("click",settingsSheet);
}

function render(){view.name==="client"?renderClient():renderList()}

/* ---------- hojas ---------- */
function openSheet(html,onMount){
  layer.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=document.getElementById("scrim");
  scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet()});
  document.addEventListener("keydown",escClose);
  onMount&&onMount(scrim.querySelector(".sheet"));
  const f=scrim.querySelector("input,textarea,button"); f&&setTimeout(()=>f.focus(),30);
}
function escClose(e){if(e.key==="Escape")closeSheet()}
function closeSheet(){layer.innerHTML="";document.removeEventListener("keydown",escClose)}

function clientSheet(c){
  const isNew=!c;
  openSheet(`<h3>${isNew?"Nuevo cliente":"Editar cliente"}</h3>
    <form id="f" novalidate>
      <div class="field"><label for="cn">Nombre</label><input id="cn" value="${esc(c?c.nombre:"")}" placeholder="Ej. Señora Carmen" autocomplete="off"></div>
      <div class="field"><label for="ct">Teléfono (WhatsApp)</label><input id="ct" inputmode="tel" value="${esc(c?c.tel:"")}" placeholder="0414 123 4567"></div>
      <div class="field"><label for="cnt">Nota</label><input id="cnt" value="${esc(c?c.nota:"")}" placeholder="Dónde vive, cuándo paga…"></div>
      <div class="err" id="er"></div>
      <div class="row2">
        ${isNew?`<button type="button" class="btn ghost" id="cancel">Cancelar</button>`:`<button type="button" class="btn ghost" id="delC" style="color:var(--margin)">Borrar cliente</button>`}
        <button class="btn" style="background:var(--ink);color:var(--paper);border-color:var(--ink)">${isNew?"Guardar":"Guardar cambios"}</button>
      </div>
    </form>`,sh=>{
      sh.querySelector("#f").addEventListener("submit",e=>{
        e.preventDefault();
        const nombre=sh.querySelector("#cn").value.trim();
        if(!nombre){sh.querySelector("#er").textContent="Escribe el nombre del cliente.";return}
        const tel=sh.querySelector("#ct").value.trim(), nota=sh.querySelector("#cnt").value.trim();
        if(isNew){const id=uid();db.clientes.push({id,nombre,tel,nota,creado:Date.now()});save();closeSheet();view={...view,name:"client",id};render();window.scrollTo(0,0);toast("Cliente anotado")}
        else{Object.assign(c,{nombre,tel,nota});save();closeSheet();render();toast("Cambios guardados")}
      });
      const ca=sh.querySelector("#cancel"); ca&&ca.addEventListener("click",closeSheet);
      const dc=sh.querySelector("#delC"); dc&&dc.addEventListener("click",()=>confirmSheet("¿Borrar a "+c.nombre+"?","Se borran también todos sus movimientos. No se puede deshacer.","Borrar cliente",()=>{db.clientes=db.clientes.filter(x=>x.id!==c.id);db.movs=db.movs.filter(m=>m.cid!==c.id);save();view.name="list";render();toast("Cliente borrado")}));
    });
}

function movSheet(c,tipo,saldo){
  let moneda="USD";
  openSheet(`<h3>${tipo==="fiado"?"Fiar a ":"Abono de "}${esc(c.nombre)}</h3>
    <form id="f" novalidate>
      <div class="field"><label for="ma">Monto</label>
        <div class="amount-row"><input id="ma" inputmode="decimal" placeholder="0,00" autocomplete="off">
          <div class="seg" role="group" aria-label="Moneda"><button type="button" data-m="USD" aria-pressed="true">$</button><button type="button" data-m="VES" aria-pressed="false">Bs</button></div></div>
        <div class="hint" id="hint">&nbsp;</div></div>
      <div class="field"><label for="mn">${tipo==="fiado"?"¿Qué se llevó?":"Nota"}</label><input id="mn" placeholder="${tipo==="fiado"?"Harina, aceite…":"Efectivo, pago móvil…"}" autocomplete="off"></div>
      ${tipo==="abono"&&saldo>0.004?`<p class="small" style="margin:-4px 0 10px">Debe ${usd(saldo)}. <button type="button" class="linkbtn" id="all">Pagó todo</button></p>`:""}
      <div class="err" id="er"></div>
      <div class="row2"><button type="button" class="btn ghost" id="cancel">Cancelar</button>
        <button class="btn ${tipo==="fiado"?"debt":"pay"}">${tipo==="fiado"?"Anotar fiado":"Anotar abono"}</button></div>
    </form>`,sh=>{
      const a=sh.querySelector("#ma"), hint=sh.querySelector("#hint");
      const upd=()=>{const n=parseNum(a.value); hint.textContent=n>0?(moneda==="USD"?"= "+bs(n*db.tasa):"= "+usd(n/db.tasa)+" a "+fBS.format(db.tasa)+" Bs/$"):" "};
      a.addEventListener("input",upd);
      sh.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{moneda=b.dataset.m;sh.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));upd();a.focus()}));
      const all=sh.querySelector("#all"); all&&all.addEventListener("click",()=>{moneda="USD";sh.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.m==="USD")));a.value=fUSD.format(saldo);upd()});
      sh.querySelector("#cancel").addEventListener("click",closeSheet);
      sh.querySelector("#f").addEventListener("submit",e=>{
        e.preventDefault();
        const n=parseNum(a.value);
        if(!(n>0)){sh.querySelector("#er").textContent="Escribe un monto mayor que cero, por ejemplo 5,50.";return}
        const u=moneda==="USD"?n:n/db.tasa;
        db.movs.push({id:uid(),cid:c.id,tipo,usd:Math.round(u*100)/100,moneda,orig:n,tasa:db.tasa,nota:sh.querySelector("#mn").value.trim(),fecha:Date.now()});
        save();closeSheet();render();toast(tipo==="fiado"?"Fiado anotado":"Abono anotado");
      });
    });
}

function waPhone(t){
  let d=(t||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("58")) return d;
  if(d.startsWith("0")) d=d.slice(1);
  return "58"+d;
}
function waSheet(c,s){
  const pend=s.movs.filter(m=>m.tipo==="fiado").slice(-3).map(m=>`• ${fecha(m.fecha)}: ${m.nota||"Fiado"} (${usd(m.usd)})`).join("\n");
  const first=c.nombre.trim().split(/\s+/);
  const saludo=/^(señora|señor|sra\.?|sr\.?|don|doña)$/i.test(first[0])?c.nombre.trim():first[0];
  const msg=`Hola ${saludo}, te escribe ${db.negocio||"tu bodega"}.\n\nTu saldo pendiente es de ${usd(s.bal)} (${bs(s.bal*db.tasa)} a tasa de hoy ${fBS.format(db.tasa)}).\n\nÚltimos fiados:\n${pend}\n\n¿Cuándo puedes pasar a abonar? ¡Gracias!`;
  const ph=waPhone(c.tel);
  const href="https://wa.me/"+(ph||"")+"?text="+encodeURIComponent(msg);
  openSheet(`<h3>Cobrar a ${esc(c.nombre)}</h3>
    <div class="msgbox" id="msg">${esc(msg)}</div>
    ${ph?"":`<p class="small">Este cliente no tiene teléfono. WhatsApp te pedirá elegir el contacto.</p>`}
    <div class="row2"><button type="button" class="btn ghost" id="copy">Copiar mensaje</button>
      <a class="btn pay" href="${href}" target="_blank" rel="noopener" style="text-decoration:none">${I.wa}Abrir WhatsApp</a></div>`,sh=>{
      sh.querySelector("#copy").addEventListener("click",()=>{
        const done=()=>toast("Mensaje copiado");
        try{navigator.clipboard.writeText(msg).then(done,()=>{selectText(sh.querySelector("#msg"));toast("Selecciona y copia el texto")})}
        catch(e){selectText(sh.querySelector("#msg"));toast("Selecciona y copia el texto")}
      });
    });
}
function selectText(el){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}

function confirmSheet(title,body,label,fn){
  openSheet(`<h3>${esc(title)}</h3><p class="small" style="margin:0 0 16px">${esc(body)}</p>
    <div class="row2"><button type="button" class="btn ghost" id="no">Cancelar</button>
    <button type="button" class="btn debt" id="yes">${esc(label)}</button></div>`,sh=>{
      sh.querySelector("#no").addEventListener("click",closeSheet);
      sh.querySelector("#yes").addEventListener("click",()=>{closeSheet();fn()});
    });
}
function confirmClearExamples(){
  confirmSheet("¿Borrar los ejemplos?","Se quitan los clientes de ejemplo y su historial. Tus propios clientes se quedan.","Borrar ejemplos",()=>{
    db.clientes=db.clientes.filter(c=>!c.ejemplo);db.movs=db.movs.filter(m=>!m.ejemplo);save();render();toast("Listo, tu libreta está limpia");
  });
}

function settingsSheet(){
  openSheet(`<h3>Ajustes</h3>
    <form id="f" novalidate>
      <div class="field"><label for="sn">Nombre del negocio</label><input id="sn" value="${esc(db.negocio)}" placeholder="Bodega La Esquina"></div>
      <p class="small" style="margin:0 0 12px">Aparece en los mensajes de cobro. Tasa guardada ${ago(db.tasaFecha||Date.now())}.</p>
      <button class="btn full" style="background:var(--ink);color:var(--paper);border-color:var(--ink)">Guardar</button>
    </form>
    <h3 style="font-size:22px;margin-top:22px">Respaldo</h3>
    <p class="small" style="margin:0 0 10px">Tus datos viven solo en este teléfono. Guarda un respaldo de vez en cuando por si lo pierdes o cambias de equipo.</p>
    <div class="row2"><button type="button" class="btn ghost" id="exp">Descargar respaldo</button>
      <label class="btn ghost" for="imp" style="cursor:pointer">Cargar respaldo</label><input id="imp" type="file" accept="application/json,.json" hidden></div>
    <p class="err" id="er"></p>`,sh=>{
      sh.querySelector("#f").addEventListener("submit",e=>{e.preventDefault();db.negocio=sh.querySelector("#sn").value.trim()||"Mi negocio";save();closeSheet();render();toast("Ajustes guardados")});
      sh.querySelector("#exp").addEventListener("click",()=>{
        try{
          const blob=new Blob([JSON.stringify(db,null,1)],{type:"application/json"});
          const a=document.createElement("a");a.href=URL.createObjectURL(blob);
          a.download="fiao-respaldo-"+new Date().toISOString().slice(0,10)+".json";
          document.body.appendChild(a);a.click();a.remove();toast("Respaldo descargado");
        }catch(e){sh.querySelector("#er").textContent="Este navegador no permitió la descarga."}
      });
      sh.querySelector("#imp").addEventListener("change",ev=>{
        const file=ev.target.files[0]; if(!file) return;
        const r=new FileReader();
        r.onload=()=>{try{const d=JSON.parse(r.result); if(!d||!Array.isArray(d.clientes)||!Array.isArray(d.movs)) throw 0; db=d;save();closeSheet();view.name="list";render();toast("Respaldo cargado: "+d.clientes.length+" clientes")}
          catch(e){sh.querySelector("#er").textContent="Ese archivo no es un respaldo de Fiao."}};
        r.readAsText(file);
      });
    });
}

let tt;
function toast(t){
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true},2200);
}

render();

/* Funciona sin internet cuando está publicada en su propio dominio */
try{
  if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.hostname)){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
}catch(e){}

window.__fiao={stateOf,summary,parseNum,waPhone,get db(){return db}};
})();
</script>
